apiVersion: apps/v1
kind: Deployment
metadata:
  name: metering-simulator
  namespace: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metering-simulator
  template:
    metadata:
      labels:
        app: metering-simulator
    spec:
      containers:
        - name: metering-simulator
          image: otel-demo/metering-simulator:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: BILLING_URL
              value: "http://billing-api:8080"
            - name: SIMULATOR_INTERVAL_SECONDS
              value: "2"
          envFrom:
            - secretRef:
                name: otel-credentials
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
