# Kopieren nach k8s/otel-credentials.yaml und Werte eintragen.
# Die echte Datei ist per .gitignore ausgenommen -- das Token gehoert
# nicht ins Repository.
#
# Endpunkt und Token stehen in dash0 unter Settings -> Endpoints.
# Fuer OTLP ueber gRPC:  https://ingress.<region>.dash0.com:4317
# Fuer OTLP ueber HTTP:  https://ingress.<region>.dash0.com  (Port 443)
#                        zusaetzlich OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
apiVersion: v1
kind: Secret
metadata:
  name: otel-credentials
  namespace: otel-demo
type: Opaque
stringData:
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://ingress.REGION.dash0.com:4317"
  # Das Leerzeichen nach Bearer muss als %20 kodiert werden.
  OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer%20DEIN_TOKEN"
