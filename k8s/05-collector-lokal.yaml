# Optionaler OpenTelemetry-Collector fuer den lokalen Betrieb.
#
# Zweck: Die Demo laeuft damit vollstaendig ohne dash0 und ohne Internet --
# als Rueckfallebene, wenn im Hoersaal das Netz streikt, und zum Pruefen,
# ob die Instrumentierung ueberhaupt Daten liefert. Der debug-Exporter
# schreibt jede Spanne in das Log des Collectors:
#
#   kubectl -n otel-demo logs -f deployment/otel-collector
#
# Fuer den Betrieb mit dash0 wird dieser Collector nicht gebraucht; dann
# zeigt OTEL_EXPORTER_OTLP_ENDPOINT direkt auf den dash0-Endpunkt.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel-demo
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector:0.139.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: otel-demo
spec:
  selector:
    app: otel-collector
  ports:
    - name: grpc
      port: 4317
      targetPort: 4317
    - name: http
      port: 4318
      targetPort: 4318
